version: '3.9'

services:
  frontend:
    build:
      context: ./WEB-LOGIN
      dockerfile: Dockerfile
    container_name: frontend
    ports:
      - "4200:4200"    
    depends_on:
      - backend

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "3000:3000"   
    environment:
      DB_HOST: 192.168.1.136        
      DB_USER: ubun
      DB_PASSWORD: root
      DB_NAME: PruebaFedora1
    depends_on:
      - db

  db:
    image: mariadb:latest
    container_name: db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: PruebaFedora
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
